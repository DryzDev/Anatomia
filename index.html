<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anatomia : le quiz du corps humain</title>
<style>
:root{--bg:#eef3f7;--fg:#0e1a24;--mut:#566673;--card:rgba(255,255,255,.78);--line:#c4d0d8;--acc:#0a7ea4;--acc2:#5a4fcf;--accfg:#fff;--ok:#1a8f4e;--ko:#c93b3b;--skin:#f0d5c4;--muscle:#d9776f;--nerve:#b89500;--bone:#5c6b77;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070d13;--fg:#e6eef3;--mut:#8ea0ad;--card:rgba(17,29,38,.72);--line:#25363f;--acc:#3ccfff;--acc2:#7c6cff;--accfg:#04222e;--ok:#2fb870;--ko:#ff6b6b;--skin:#3a4a55;--muscle:#8a3b3b;--nerve:#e0c13a;--bone:#cfe3ee;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#070d13;--fg:#e6eef3;--mut:#8ea0ad;--card:rgba(17,29,38,.72);--line:#25363f;--acc:#3ccfff;--acc2:#7c6cff;--accfg:#04222e;--ok:#2fb870;--ko:#ff6b6b;--skin:#3a4a55;--muscle:#8a3b3b;--nerve:#e0c13a;--bone:#cfe3ee;color-scheme:dark}
html{min-height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:32px 32px;opacity:.25;pointer-events:none}
#bg{position:fixed;top:50%;left:50%;height:94%;width:auto;transform:translate(-50%,-50%);opacity:.34;pointer-events:none;filter:drop-shadow(0 0 14px var(--acc))}
.L{transition:opacity 1.2s ease}
main{position:relative;max-width:660px;margin:0 auto;padding:20px 16px 56px}
h1{font:700 clamp(30px,8vw,46px)/1.08 Georgia,"Times New Roman",serif;letter-spacing:-.02em;margin:18px 0 10px;background:linear-gradient(100deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:21px;line-height:1.3;margin:14px 0 18px}
h3{font:600 13px ui-monospace,Menlo,monospace;letter-spacing:.04em;color:var(--acc);margin:28px 0 10px}
p{margin:0 0 10px}.mut{color:var(--mut)}
.tag{font:600 12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.03em;color:var(--acc);margin:0 0 8px}
.col{display:grid;gap:12px}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.me{display:flex;align-items:center;gap:12px}.me small{display:block;color:var(--mut);font-size:13px}
.av{flex:none;display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,hsl(var(--h) 70% 55%),hsl(calc(var(--h) + 50) 70% 40%));color:#fff;font:700 12px ui-monospace,Menlo,monospace}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.tile{display:flex;flex-direction:column;gap:4px;min-height:136px;padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(10px);color:var(--fg);text-align:center;align-items:center;justify-content:center;transition:transform .25s,box-shadow .25s,border-color .25s}
.tile:hover{transform:translateY(-3px);box-shadow:0 12px 30px -12px var(--acc);border-color:var(--acc)}
.tile.hot{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--accfg);border:0}
.tile i{font-size:26px;font-style:normal}.tile b{font-size:18px}.tile span{font-size:13px;opacity:.82}
.lb{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.lb li{display:grid;grid-template-columns:26px 34px 1fr auto;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:14px;background:var(--card);backdrop-filter:blur(10px);animation:up .5s both}
.lb li.me{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}.lb li.ghost{opacity:.7}.lb li.gap{display:block;text-align:center;border:0;background:none}
.lb b{font:700 14px ui-monospace,Menlo,monospace;color:var(--mut)}.lb li:first-child b{color:var(--nerve)}
.lb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lb em{font:700 16px ui-monospace,Menlo,monospace;font-style:normal;color:var(--acc)}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.lnk{background:none;border:0;color:var(--mut);padding:6px 0}
.lv{font:600 12px ui-monospace,Menlo,monospace;border:1px solid currentColor;padding:2px 10px;border-radius:99px}
.l0{color:var(--ok)}.l1{color:var(--acc)}.l2{color:var(--ko)}
.tm{position:relative;display:flex;justify-content:flex-end;align-items:center;height:36px;margin:14px 0 4px;padding-right:14px;border:1px solid var(--line);border-radius:99px;background:var(--card);overflow:hidden;transition:opacity .5s}
.tm.off{opacity:.35}
.tb{position:absolute;inset:0;transform-origin:left;transition:transform .12s linear;background:var(--tc,var(--ok));opacity:.38}
.pt{position:relative;font:600 14px ui-monospace,Menlo,monospace}.pt b{font-size:18px}
.ans{display:flex;gap:12px;align-items:center;width:100%;min-height:56px;max-height:140px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);backdrop-filter:blur(8px);color:var(--fg);text-align:left;overflow:hidden;transition:max-height .6s cubic-bezier(.2,.8,.2,1),opacity .4s,transform .5s,padding .5s,margin .5s,background .4s,border-color .3s}
.ans:hover:not(:disabled){border-color:var(--acc);transform:translateX(4px)}
.ans i{flex:none;display:grid;place-items:center;width:28px;height:28px;border:1px solid currentColor;border-radius:8px;color:var(--acc);font:600 13px ui-monospace,Menlo,monospace;font-style:normal}
.ans.out{opacity:0;transform:scale(.94);max-height:0;min-height:0;padding-top:0;padding-bottom:0;border-width:0;margin:-6px 0}
.ans.good{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600;animation:ring 1s ease-out}.ans.good i{color:#fff}
.ans.bad{background:var(--ko);border-color:var(--ko);color:#fff;animation:shake .5s}.ans.bad i{color:#fff}
.rv>*{animation:up .7s cubic-bezier(.2,.8,.2,1) both}.rv>:nth-child(2){animation-delay:.12s}.rv>:nth-child(3){animation-delay:.24s}.rv>:nth-child(4){animation-delay:.36s}
.gain{display:flex;align-items:baseline;gap:8px;margin-top:16px}.gain span{font:700 46px/1 Georgia,serif;color:var(--ok)}.gain.zero span{color:var(--ko)}
.exp{display:flex;gap:16px;margin:12px 0;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--card);backdrop-filter:blur(10px)}
.dg{width:140px;height:auto;flex:none}.dg.t{width:100px}
.src{display:inline-block;margin-top:4px;color:var(--acc);font-size:14px}
.big{display:flex;flex-direction:column;width:100%;padding:16px 18px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--accfg);text-align:left;transition:transform .2s}
.big:hover{transform:translateY(-2px)}.big b{font-size:17px}.big span{font-size:14px;opacity:.85}.big.alt{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.o{fill:var(--mut);stroke:var(--mut);opacity:.35}.o.on{fill:var(--acc);stroke:var(--acc);opacity:1;animation:p 1.6s infinite}
.score{font:700 64px/1 Georgia,serif;margin:8px 0}
.top{text-align:center;padding:16px 16px 0;cursor:pointer;position:relative}.logo{display:inline-flex;align-items:center;font:800 clamp(26px,7.5vw,40px)/1 Georgia,'Times New Roman',serif;letter-spacing:.16em;background:linear-gradient(100deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}.bn{height:1.1em;width:auto;margin:0 .1em 0 .02em;fill:var(--acc2);filter:drop-shadow(0 0 6px var(--acc))}.top small{display:block;margin-top:2px;font:600 11px ui-monospace,Menlo,monospace;letter-spacing:.14em;color:var(--mut)}
.ctr{text-align:center}button.me{width:100%;border:1px solid var(--line);border-radius:18px;background:var(--card);backdrop-filter:blur(10px);padding:12px 14px;color:var(--fg);text-align:left}.me>div{flex:1;min-width:0}.rb{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 2px}.rb div{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.sk{display:inline-flex;align-items:center;gap:2px;font:700 20px ui-monospace,Menlo,monospace}.sk.off{filter:grayscale(1);opacity:.5}.fl{display:inline-block;font-style:normal;font-size:24px;transform-origin:50% 90%;animation:fl 1.1s ease-in-out infinite alternate}.sk.off .fl{animation:none}@keyframes fl{from{transform:scale(1) rotate(-4deg)}to{transform:scale(1.18) rotate(4deg)}}
.chips{display:flex;gap:10px;justify-content:center;margin:14px 0 0;flex-wrap:wrap}.chip{padding:8px 16px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--fg);transition:border-color .2s}.chip:hover{border-color:var(--acc)}.xl{display:flex;justify-content:center}.xl .av{width:88px;height:88px;font-size:30px}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.st div{padding:12px 6px;border:1px solid var(--line);border-radius:14px;background:var(--card);text-align:center}.st b{display:block;font:700 22px Georgia,serif;color:var(--acc)}.st small{color:var(--mut);font-size:12px}
.ld{list-style:none;padding:0;margin:0;display:grid;gap:6px}.ld li{display:flex;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);opacity:.55}.ld li.on{opacity:1}.ld li.cur{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}.ld em{margin-left:auto;font:600 13px ui-monospace,Menlo,monospace;font-style:normal;color:var(--mut)}
input{width:100%;box-sizing:border-box;padding:12px 14px;margin:6px 0 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);font:inherit}
.hi{padding:12px 14px;margin:0 0 8px;border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:12px;background:var(--card)}.hi.ko{border-left-color:var(--ko)}.hi p{margin:4px 0 0;font-size:14px;color:var(--mut)}.hi em{font-style:normal;color:var(--acc)}.lb small{display:block;color:var(--mut);font-size:11px}.lb em small{display:inline}.zm{margin:12px 0 4px;text-align:center}.zm svg{width:100%;max-width:260px;height:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}.zm figcaption{font-size:12px;color:var(--mut);margin-top:4px}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
@keyframes p{50%{opacity:.5}}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}100%{box-shadow:0 0 0 24px transparent}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<svg id="bg" viewBox="0 0 200 410" aria-hidden="true"></svg>
<header class='top' onclick='home()'><div class='logo'>ANATOM<svg class='bn' viewBox='0 0 20 60' role='img' aria-label='I'><circle cx='6' cy='6' r='5'/><circle cx='14' cy='6' r='5'/><circle cx='6' cy='54' r='5'/><circle cx='14' cy='54' r='5'/><rect x='7' y='6' width='6' height='48'/></svg>A</div><small>le quiz du corps humain</small></header>
<main id="app"></main>
<script>
const Q=[
[0,"Quel organe pompe le sang dans tout le corps ?",["Le cœur","Le foie","Les poumons","Les reins"],"heart","Le cœur est un muscle creux divisé en quatre cavités : deux oreillettes qui reçoivent le sang et deux ventricules qui l’expulsent. Il bat environ 70 fois par minute au repos, soit plus de 2,5 milliards de battements dans une vie. Le côté droit envoie le sang vers les poumons (petite circulation), le côté gauche vers tout le reste du corps (grande circulation).","Cœur"],
[0,"Où se font les échanges d’oxygène et de dioxyde de carbone avec le sang ?",["Dans les alvéoles pulmonaires","Dans la trachée","Dans les bronches","Dans le diaphragme"],"lungs","Les poumons contiennent environ 300 à 500 millions d’alvéoles : de minuscules sacs aux parois ultra-fines, entourés de capillaires. L’O₂ traverse cette barrière pour rejoindre le sang, tandis que le CO₂ fait le chemin inverse avant d’être expiré. Mises à plat, ces alvéoles couvriraient une surface proche de celle d’un demi-terrain de tennis.","Alvéole_pulmonaire"],
[0,"Quel organe fabrique la bile ?",["Le foie","L’estomac","Le pancréas","Le rein"],"liver","Le foie est la plus grosse glande du corps (environ 1,5 kg). Il produit la bile, qui émulsionne les graisses pour faciliter leur digestion, puis la stocke dans la vésicule biliaire. Il joue aussi un rôle de filtre et d’usine chimique : stockage du glucose, fabrication de protéines, détoxification du sang.","Foie"],
[0,"Quel est le plus long os du corps humain ?",["Le fémur","Le tibia","L’humérus","Le radius"],"femur","Le fémur, dans la cuisse, mesure environ 45 cm chez un adulte (environ un quart de la taille). Il est aussi l’un des plus résistants : il peut supporter plusieurs fois le poids du corps lors d’une course. Son extrémité supérieure forme la tête du fémur, qui s’articule avec le bassin pour former la hanche.","Fémur"],
[0,"Quels organes filtrent le sang pour fabriquer l’urine ?",["Les reins","La vessie","Les poumons","Le foie"],"kidney","Les deux reins, de la taille d’un poing, filtrent en continu environ 180 litres de sang par jour, mais n’en font qu’environ 1,5 litre d’urine : le reste est réabsorbé. Ils régulent aussi la pression artérielle, l’équilibre en sels minéraux et produisent une hormone qui stimule la fabrication des globules rouges.","Rein"],
[0,"Dans quel organe l’essentiel des nutriments passe-t-il dans le sang ?",["L’intestin grêle","L’estomac","L’œsophage","Le gros intestin"],"intestine","L’intestin grêle mesure environ 6 mètres. Sa paroi forme des plis couverts de villosités, elles-mêmes recouvertes de microvillosités : cette architecture multiplie la surface d’absorption, estimée à plusieurs dizaines de mètres carrés. Sucres, acides aminés, graisses et vitamines y passent vers le sang ou la lymphe.","Intestin_grêle"],
[0,"Quelle structure, protégée par la colonne vertébrale, relie le cerveau au reste du corps ?",["La moelle épinière","Le cervelet","Le diaphragme","L’aorte"],"spine","La moelle épinière est un cordon nerveux d’environ 45 cm, logé dans le canal rachidien. Elle transmet les ordres moteurs du cerveau vers les muscles et remonte les informations sensibles (toucher, douleur). Elle gère aussi des réflexes rapides, comme retirer la main d’une flamme, sans attendre le cerveau.","Moelle_épinière"],
[1,"Quel vaisseau emmène le sang riche en oxygène du cœur vers le reste du corps ?",["L’aorte","La veine cave","L’artère pulmonaire","La veine porte"],"heart","L’aorte part du ventricule gauche et mesure environ 2,5 cm de diamètre : c’est la plus grosse artère du corps. Une artère se définit par le sens du flux (elle part du cœur), pas par la teneur en oxygène : l’artère pulmonaire transporte ainsi du sang pauvre en oxygène vers les poumons, et les veines pulmonaires ramènent du sang oxygéné.","Aorte"],
[1,"Quelle hormone, sécrétée par le pancréas, fait baisser la glycémie ?",["L’insuline","Le glucagon","L’adrénaline","Le cortisol"],"pancreas","L’insuline est produite par les cellules bêta des îlots de Langerhans. Elle permet aux cellules (muscles, foie, tissu adipeux) d’absorber le glucose du sang. Dans le diabète de type 1, ces cellules sont détruites ; dans le type 2, les cellules y répondent mal. Le glucagon, produit par les cellules alpha, a l’effet inverse.","Insuline"],
[1,"Quelle région du cerveau coordonne l’équilibre et la précision des mouvements ?",["Le cervelet","Le lobe frontal","Le bulbe rachidien","L’hippocampe"],"brain","Le cervelet ne représente qu’environ 10 % du volume du cerveau, mais il contient plus de la moitié de ses neurones. Il compare en permanence le mouvement voulu au mouvement réalisé et corrige en temps réel : c’est lui qui rend un geste fluide. L’hippocampe, lui, est surtout impliqué dans la mémoire.","Cervelet"],
[1,"Quelle cellule du sang transporte l’oxygène ?",["Le globule rouge","Le globule blanc","La plaquette","Le lymphocyte"],"heart","Un globule rouge contient environ 270 millions de molécules d’hémoglobine, une protéine riche en fer qui fixe l’oxygène dans les poumons et le libère dans les tissus. Fabriqués dans la moelle osseuse, ils vivent environ 120 jours et n’ont pas de noyau, ce qui laisse plus de place à l’hémoglobine.","Globule_rouge"],
[1,"Quel muscle, situé sous les poumons, est le principal moteur de l’inspiration ?",["Le diaphragme","Le grand pectoral","Les abdominaux","Le trapèze"],"lungs","Le diaphragme est un muscle en forme de dôme qui sépare le thorax de l’abdomen. En se contractant, il s’aplatit et s’abaisse : le volume de la cage thoracique augmente, la pression chute et l’air est aspiré. L’expiration au repos est passive : le muscle se relâche et les poumons reprennent leur taille.","Diaphragme_(anatomie)"],
[1,"Quelle partie de l’appareil digestif réabsorbe l’essentiel de l’eau restante ?",["Le côlon","L’estomac","Le duodénum","L’œsophage"],"intestine","Le côlon (gros intestin) mesure environ 1,5 mètre. Il réabsorbe l’eau et les sels minéraux du bol alimentaire, ce qui solidifie progressivement les selles. Il héberge aussi des milliers de milliards de bactéries (le microbiote) qui fermentent des fibres et produisent des vitamines comme la K.","Côlon_(anatomie)"],
[1,"Comment appelle-t-on l’unité fonctionnelle du rein ?",["Le néphron","L’alvéole","Le lobule","Le neurone"],"kidney","Chaque rein contient environ un million de néphrons. Un néphron est formé d’un glomérule, qui filtre le sang, suivi d’un long tubule où l’eau, le glucose et les sels utiles sont réabsorbés, tandis que les déchets sont sécrétés. L’urine finale est le résultat de ces trois étapes : filtration, réabsorption, sécrétion.","Néphron"],
[2,"Quel neurotransmetteur un motoneurone libère-t-il pour déclencher la contraction d’un muscle squelettique ?",["L’acétylcholine","La dopamine","La sérotonine","Le GABA"],"spine","À la jonction neuromusculaire, l’arrivée d’un potentiel d’action libère de l’acétylcholine dans la fente synaptique. Elle se fixe sur des récepteurs nicotiniques de la fibre musculaire, ce qui ouvre des canaux ioniques et déclenche une dépolarisation, puis la libération de calcium et la contraction. Dans la myasthénie, ces récepteurs sont attaqués par le système immunitaire.","Acétylcholine"],
[2,"Quelle région du néphron l’hormone antidiurétique (ADH) cible-t-elle principalement ?",["Le tube collecteur","Le tube contourné proximal","L’anse de Henlé descendante","Le glomérule"],"kidney","L’ADH (vasopressine), sécrétée par l’hypothalamus puis libérée par l’hypophyse postérieure, se fixe sur des récepteurs V2 du tube collecteur (et du tube distal). Elle provoque l’insertion d’aquaporines-2 dans la membrane : l’eau est réabsorbée et l’urine se concentre. Son déficit cause un diabète insipide, avec de très grandes quantités d’urine diluée.","Vasopressine"],
[2,"Le premier bruit du cœur (« toum ») correspond à…",["La fermeture des valves auriculo-ventriculaires","La fermeture des valves aortique et pulmonaire","L’ouverture des valves auriculo-ventriculaires","Le remplissage des oreillettes"],"heart","B1 marque le début de la systole ventriculaire : la pression dans les ventricules dépasse celle des oreillettes, ce qui ferme les valves mitrale et tricuspide. B2 (« tac ») correspond à la fermeture des valves sigmoïdes, aortique et pulmonaire, au début de la diastole. Un souffle peut signaler une valve qui ferme mal ou qui est rétrécie.","Cycle_cardiaque"],
[2,"Quel nerf du système parasympathique ralentit le rythme cardiaque ?",["Le nerf vague (X)","Le nerf phrénique","Le nerf sciatique","Le nerf optique"],"heart","Le nerf vague (10e nerf crânien) libère de l’acétylcholine sur le nœud sinusal, ce qui ralentit la fréquence cardiaque. Sans cette influence, le nœud sinusal battrait spontanément autour de 100 fois par minute : le tonus vagal explique le rythme de repos de 60 à 70. Les sportifs d’endurance ont un tonus vagal très élevé, d’où un pouls souvent inférieur à 50.","Nerf_vague"],
[2,"Dans le foie, quelle molécule est synthétisée à partir de l’ammoniac pour être éliminée par les reins ?",["L’urée","La créatinine","La bilirubine","L’acide urique"],"liver","L’ammoniac, très toxique, provient du catabolisme des acides aminés. Dans les hépatocytes, le cycle de l’urée (ornithine) le convertit en urée, bien moins toxique, qui passe dans le sang puis est éliminée par les reins. Lors d’une insuffisance hépatique grave, l’ammoniac s’accumule et peut provoquer une encéphalopathie.","Cycle_de_l%27urée"],
[2,"Quel type de fibre musculaire domine chez un marathonien d’élite ?",["Les fibres lentes de type I","Les fibres rapides de type IIx","Les fibres lisses","Les fibres cardiaques"],"femur","Les fibres de type I sont riches en mitochondries, en capillaires et en myoglobine : elles produisent leur énergie par la respiration aérobie, se contractent lentement et résistent très longtemps à la fatigue. Les fibres IIx, plus puissantes mais rapidement épuisées, dominent plutôt chez les sprinteurs. La répartition est en partie génétique.","Muscle_squelettique"],
[2,"Quelles cellules de l’estomac sécrètent l’acide chlorhydrique ?",["Les cellules pariétales","Les cellules principales","Les cellules à mucus","Les cellules de Kupffer"],"stomach","Les cellules pariétales des glandes gastriques sécrètent l’HCl grâce à une pompe H⁺/K⁺-ATPase (la cible des médicaments « IPP »). Le pH gastrique descend vers 1,5 à 2, ce qui tue de nombreux microbes et active la pepsine, produite par les cellules principales sous forme de pepsinogène. Elles sécrètent aussi le facteur intrinsèque, nécessaire à l’absorption de la vitamine B12.","Estomac"],
[0,'Quelle structure osseuse protège le cerveau ?',['Le crâne','La colonne vertébrale','Le sternum','Le bassin'],'brain','Le crâne est formé de plusieurs os plats soudés entre eux par des sutures, ce qui crée une boîte rigide autour du cerveau. Seule la mandibule reste mobile. Chez le nouveau-né, ces os ne sont pas encore soudés : les « fontanelles » sont des zones souples qui se ferment en quelques mois.','Crâne'],
[0,'Quel est le plus grand organe du corps humain ?',['La peau','Le foie','Les poumons','L’intestin grêle'],'skin','La peau couvre environ 1,5 à 2 m² et pèse environ 4 kg chez un adulte. Elle protège des microbes, des chocs et des UV, régule la température grâce à la sueur et possède des millions de récepteurs sensibles au toucher, à la douleur et à la température.','Peau'],
[0,'Combien de cavités comporte le cœur humain ?',['Quatre','Deux','Trois','Six'],'heart','Le cœur comporte deux oreillettes (en haut) et deux ventricules (en bas). Une cloison sépare le cœur droit, qui envoie le sang vers les poumons, du cœur gauche, qui l’envoie vers le reste du corps : les deux côtés battent ensemble mais ne mélangent jamais leur sang.','Cœur'],
[0,'Quel organe contrôle la pensée, la mémoire et les mouvements ?',['Le cerveau','Le cœur','Le foie','L’estomac'],'brain','Le cerveau pèse environ 1,4 kg et contient environ 86 milliards de neurones. Il représente seulement 2 % du poids du corps mais consomme près de 20 % de son énergie, même au repos.','Cerveau_humain'],
[0,'Quel gaz est plus abondant dans l’air expiré que dans l’air inspiré ?',['Le dioxyde de carbone','L’azote','L’hélium','L’hydrogène'],'lungs','L’air inspiré contient environ 21 % d’oxygène et 0,04 % de dioxyde de carbone. L’air expiré contient environ 16 % d’oxygène et 4 % de CO₂ : les cellules ont consommé de l’oxygène et rejeté du CO₂, que le sang ramène aux poumons.','Respiration'],
[0,'Quel organe stocke l’urine avant son évacuation ?',['La vessie','Le rein','L’uretère','La prostate'],'bladder','La vessie peut contenir environ 400 à 500 mL, mais l’envie d’uriner apparaît dès 150 à 250 mL. Sa paroi musculaire, le détrusor, se contracte lors de la miction pendant que le sphincter se relâche.','Vessie'],
[0,'Quel os plat, au centre de la poitrine, relie les côtes à l’avant ?',['Le sternum','La clavicule','L’omoplate','Le coccyx'],'lungs','Le sternum mesure environ 17 cm. Les sept premières paires de côtes s’y attachent directement par du cartilage, ce qui forme avec la colonne vertébrale une cage protégeant le cœur et les poumons tout en restant assez souple pour respirer.','Sternum'],
[0,'Quelle vitamine la peau fabrique-t-elle sous l’effet du soleil ?',['La vitamine D','La vitamine C','La vitamine K','La vitamine B12'],'skin','Sous l’effet des rayons UVB, la peau transforme un dérivé du cholestérol en vitamine D. Elle favorise l’absorption du calcium par l’intestin, donc la solidité des os : son manque chez l’enfant provoque le rachitisme.','Vitamine_D'],
[1,'Quelle est la fonction principale des globules blancs ?',['Défendre l’organisme contre les infections','Transporter l’oxygène','Faire coaguler le sang','Transporter les nutriments'],'heart','Les leucocytes (neutrophiles, lymphocytes, monocytes…) naissent dans la moelle osseuse et circulent dans le sang et la lymphe. Un adulte en compte environ 4 000 à 10 000 par microlitre de sang ; leur nombre augmente souvent lors d’une infection.','Leucocyte'],
[1,'Quel type de vaisseau possède des valvules anti-retour et ramène le sang vers le cœur ?',['Les veines','Les artères','Les capillaires','L’aorte'],'heart','Les veines ont une paroi plus fine que les artères et des valvules qui empêchent le sang de redescendre, surtout dans les jambes. La contraction des muscles du mollet « pompe » le sang vers le haut : c’est le retour veineux.','Veine'],
[1,'Quelle glande, à la base du cou, produit les hormones thyroïdiennes ?',['La thyroïde','L’hypophyse','Le thymus','La parotide'],'thyroid','La thyroïde, en forme de papillon, régule le métabolisme grâce à la thyroxine (T4) et à la triiodothyronine (T3), qui contiennent de l’iode. Un manque d’iode alimentaire peut provoquer un goitre, c’est-à-dire une thyroïde augmentée de volume.','Thyroïde'],
[1,'Quelle enzyme du suc pancréatique digère les graisses ?',['La lipase','La pepsine','La trypsine','La lactase'],'pancreas','Le pancréas déverse dans le duodénum un suc riche en enzymes : lipase (graisses), amylase (amidon) et protéases comme la trypsine (protéines). La bile du foie aide la lipase en émulsionnant les graisses en fines gouttelettes.','Lipase'],
[1,'Quel volume d’air un adulte inspire-t-il environ à chaque respiration calme ?',['0,5 litre','0,05 litre','2 litres','5 litres'],'lungs','Au repos, on inspire environ 0,5 L par cycle, à raison de 12 à 20 cycles par minute, soit 6 à 10 litres d’air par minute. La capacité pulmonaire totale, en inspirant à fond, atteint environ 6 litres.','Respiration'],
[1,'Quel lobe cérébral traite principalement les informations visuelles ?',['Le lobe occipital','Le lobe frontal','Le lobe temporal','Le lobe pariétal'],'brain','Situé à l’arrière du cerveau, le lobe occipital contient le cortex visuel primaire (aire V1). Une lésion de cette zone peut provoquer une cécité corticale : les yeux fonctionnent, mais le cerveau ne reçoit plus l’image.','Lobe_occipital'],
[1,'Quel os, massif et situé à l’avant, forme l’essentiel du bas de la jambe ?',['Le tibia','Le péroné','La rotule','Le fémur'],'femur','Le tibia supporte l’essentiel du poids entre le genou et la cheville, alors que le péroné, plus fin, sert surtout d’attache musculaire et stabilise la cheville. Sa crête antérieure se palpe directement sous la peau.','Tibia'],
[1,'À quoi sert principalement la vésicule biliaire ?',['Stocker et concentrer la bile','Produire la bile','Produire l’insuline','Filtrer le sang'],'liver','Elle mesure environ 8 cm et stocke 30 à 50 mL de bile, qu’elle concentre. Un repas gras déclenche sa contraction pour libérer la bile dans le duodénum. Des calculs biliaires peuvent provoquer de fortes douleurs et obstruer le canal.','Vésicule_biliaire'],
[2,'Quelle cellule du pancréas sécrète le glucagon ?',['Les cellules alpha','Les cellules bêta','Les cellules delta','Les cellules acineuses'],'pancreas','Les îlots de Langerhans contiennent des cellules alpha (glucagon, qui augmente la glycémie), bêta (insuline) et delta (somatostatine). Le glucagon stimule la glycogénolyse et la néoglucogenèse hépatiques lors du jeûne.','Pancréas'],
[2,'Où se fait principalement la production des globules rouges chez l’adulte ?',['Dans la moelle osseuse rouge','Dans la rate','Dans le foie','Dans les reins'],'femur','Chez l’adulte, l’érythropoïèse a lieu dans la moelle osseuse rouge des os plats et des extrémités des os longs, sous contrôle de l’érythropoïétine (EPO), sécrétée par le rein. Chez le fœtus, le foie et la rate assurent cette fonction.','Moelle_osseuse'],
[2,'Quelle structure est le « pacemaker » naturel du cœur ?',['Le nœud sinusal','Le nœud auriculo-ventriculaire','Le faisceau de His','La valve mitrale'],'heart','Le nœud sinusal, dans l’oreillette droite, déclenche spontanément l’influx électrique à environ 60 à 100 impulsions par minute. Le nœud auriculo-ventriculaire retarde ensuite l’influx pour laisser les ventricules se remplir avant leur contraction.','Nœud_sinusal'],
[2,'Quelle hormone de l’hypophyse antérieure stimule la thyroïde ?',['La TSH','L’ACTH','La LH','L’hormone de croissance'],'brain','L’hypophyse antérieure sécrète la TSH, qui stimule la thyroïde. L’axe hypothalamo-hypophysaire fonctionne en rétrocontrôle négatif : un excès de T3 et T4 freine la sécrétion de TRH et de TSH.','Thyréostimuline'],
[2,'Quel segment du néphron réabsorbe environ 65 % du sodium filtré ?',['Le tube contourné proximal','L’anse de Henlé ascendante','Le tube collecteur','Le tube contourné distal'],'kidney','Le tube contourné proximal réabsorbe environ 65 % de l’eau et du sodium filtrés, ainsi que la quasi-totalité du glucose et des acides aminés. Si la glycémie dépasse le seuil de réabsorption, du glucose apparaît dans l’urine : c’est la glycosurie du diabète.','Néphron'],
[2,'Quelle hormone gastrique stimule la sécrétion d’acide par l’estomac ?',['La gastrine','La sécrétine','La cholécystokinine','La somatostatine'],'stomach','La gastrine, sécrétée par les cellules G de l’antre gastrique, stimule les cellules pariétales en réponse à la distension de l’estomac et à la présence de protéines. La somatostatine freine au contraire cette sécrétion.','Gastrine'],
[2,'Quelle zone du cerveau est la plus impliquée dans la formation de nouveaux souvenirs ?',['L’hippocampe','L’amygdale','Le cervelet','Le thalamus'],'brain','L’hippocampe, dans le lobe temporal médian, consolide les souvenirs récents. Le patient H.M., qui avait subi l’ablation des deux hippocampes en 1953, ne pouvait plus former de nouveaux souvenirs épisodiques, bien qu’il ait conservé ses anciens souvenirs.','Hippocampe'],
[2,'Quel est le rôle de la gaine de myéline autour d’un axone ?',['Accélérer la conduction de l’influx nerveux','Fabriquer les neurotransmetteurs','Nourrir le noyau du neurone','Recevoir les signaux des autres neurones'],'spine','La myéline, produite par les oligodendrocytes (système nerveux central) ou par les cellules de Schwann (périphérique), isole l’axone. L’influx saute de nœud de Ranvier en nœud de Ranvier, ce qui multiplie la vitesse de conduction. La sclérose en plaques est une maladie démyélinisante.','Myéline'],
[0,'Comment s’appelle la molécule qui porte l’information génétique ?',['L’ADN','Le glucose','L’hémoglobine','L’insuline'],'dna','L’ADN (acide désoxyribonucléique) est une longue molécule en double hélice, présente dans le noyau de presque toutes nos cellules. Il contient les instructions pour fabriquer nos protéines.','ADN'],
[0,'Combien de chromosomes possède une cellule humaine normale (hors cellules sexuelles) ?',['46','23','48','92'],'dna','Nos cellules contiennent 23 paires de chromosomes, soit 46 : un de chaque paire vient de la mère, l’autre du père. Les cellules sexuelles (ovules et spermatozoïdes) n’en ont que 23.','Chromosome'],
[1,'Quelle paire de chromosomes sexuels correspond à un garçon ?',['XY','XX','YY','XO'],'dna','Les femmes ont deux chromosomes X (XX), les hommes un X et un Y (XY). C’est le spermatozoïde, porteur d’un X ou d’un Y, qui détermine le sexe de l’enfant.','Chromosome'],
[1,'Quelles sont les quatre bases de l’ADN ?',['A, T, C, G','A, U, C, G','A, B, C, D','T, U, X, Y'],'dna','Adénine (A), thymine (T), cytosine (C) et guanine (G) : A s’apparie toujours avec T, et C avec G, ce qui maintient les deux brins de la double hélice. L’ARN, lui, remplace la thymine par l’uracile (U).','ADN'],
[1,'Qu’est-ce qu’un gène ?',['Un segment d’ADN qui code une information','Un type de globule blanc','Une hormone','Un organe du système immunitaire'],'dna','Un gène est un segment d’ADN contenant les instructions pour fabriquer une protéine ou une molécule d’ARN. Le génome humain compte environ 20 000 gènes codant des protéines.','Gène'],
[0,'Quelle partie de l’œil capte la lumière et envoie l’image au cerveau ?',['La rétine','Le cristallin','La cornée','L’iris'],'eye','La rétine tapisse le fond de l’œil. Ses photorécepteurs (cônes pour la couleur, bâtonnets pour la faible lumière) transforment la lumière en signaux nerveux transmis au cerveau par le nerf optique.','Rétine'],
[0,'Quel sens est lié à la cochlée ?',['L’ouïe','La vue','L’odorat','Le goût'],'ear','La cochlée, en forme d’escargot, se trouve dans l’oreille interne. Elle transforme les vibrations sonores en influx nerveux grâce à des cellules ciliées.','Cochlée'],
[0,'Quel organe permet de percevoir les saveurs ?',['La langue','Le nez','Les dents','Le palais osseux'],'tongue','La langue porte des milliers de papilles gustatives. Les saveurs de base sont le sucré, le salé, l’acide, l’amer et l’umami. Le goût dépend aussi de l’odorat : un nez bouché « enlève » une partie des saveurs.','Langue_(anatomie)'],
[1,'Quelle partie de l’œil règle la quantité de lumière qui entre ?',['L’iris','La sclère','Le nerf optique','Le corps vitré'],'eye','L’iris, la partie colorée de l’œil, contient des muscles qui dilatent ou resserrent la pupille : en pleine lumière elle se rétrécit, dans l’obscurité elle s’élargit.','Iris_(œil)'],
[1,'Quel est le plus petit os du corps humain ?',['L’étrier','L’enclume','Le marteau','Le rocher'],'ear','L’étrier, d’environ 3 mm, fait partie de la chaîne des osselets (marteau, enclume, étrier) qui transmet et amplifie les vibrations du tympan vers l’oreille interne.','Étrier_(os)'],
[1,'Où se trouvent les récepteurs de l’odorat ?',['Au fond du nez, dans la muqueuse olfactive','Dans la langue','Dans les sinus frontaux','Dans la gorge'],'nose','Environ 400 types de récepteurs olfactifs tapissent le haut de la cavité nasale. Leurs signaux passent par le bulbe olfactif puis rejoignent des zones liées aux émotions et à la mémoire.','Odorat'],
[2,'Quelles cellules de la rétine permettent la vision des couleurs ?',['Les cônes','Les bâtonnets','Les cellules ganglionnaires','Les cellules de Müller'],'eye','L’œil compte environ 6 millions de cônes, sensibles au rouge, au vert ou au bleu, surtout concentrés dans la fovéa. Les quelque 120 millions de bâtonnets servent à la vision nocturne, sans couleurs.','Rétine'],
[0,'Quel muscle se trouve à l’avant du bras et plie le coude ?',['Le biceps','Le triceps','Le deltoïde','Le trapèze'],'biceps','Le biceps brachial plie le coude et fait tourner l’avant-bras. Le triceps, à l’arrière, fait l’inverse : ce sont deux muscles antagonistes.','Biceps_brachial'],
[0,'Quel muscle recouvre l’avant de la cuisse ?',['Le quadriceps','Les ischio-jambiers','Le mollet','Le grand fessier'],'quad','Le quadriceps, formé de quatre faisceaux, tend le genou. C’est l’un des muscles les plus puissants du corps, essentiel pour marcher, courir et monter les escaliers.','Muscle_quadriceps_fémoral'],
[0,'Quel est le plus gros muscle du corps ?',['Le grand fessier','Le biceps','Le deltoïde','Le grand pectoral'],'pelvis','Le grand fessier donne sa forme aux fesses et étend la hanche. Il intervient dans la marche, la course, la montée d’escaliers et le maintien debout.','Muscle_grand_fessier'],
[1,'Quel muscle forme l’épaule arrondie et permet de lever le bras ?',['Le deltoïde','Le grand dorsal','Le grand pectoral','Le sartorius'],'delt','Le deltoïde, en forme de triangle, recouvre l’articulation de l’épaule. Il permet d’écarter le bras sur le côté et de le lever.','Muscle_deltoïde'],
[1,'Quel est le muscle le plus long du corps ?',['Le sartorius','Le biceps','Le quadriceps','Le soléaire'],'quad','Le sartorius traverse la cuisse en diagonale, de la hanche au genou. On l’appelle « muscle du tailleur » car il aide à croiser les jambes.','Muscle_sartorius'],
[1,'Quel tendon relie le mollet au talon ?',['Le tendon d’Achille','Le tendon rotulien','Le tendon du biceps','Le fascia plantaire'],'calf','Le tendon d’Achille est le plus épais et le plus puissant du corps. Il transmet la force du mollet au talon, ce qui permet de se hisser sur la pointe des pieds.','Tendon_d%27Achille'],
[2,'Quels muscles forment le triceps sural (le mollet) ?',['Le gastrocnémien et le soléaire','Le tibial antérieur et le péronier','Le quadriceps et le sartorius','Le psoas et l’iliaque'],'calf','Le gastrocnémien (jumeaux) et le soléaire se rejoignent dans le tendon d’Achille. Le gastrocnémien agit sur le genou et la cheville, le soléaire seulement sur la cheville.','Triceps_sural'],
[0,'Quel os relie l’épaule au sternum et se fracture souvent lors d’une chute ?',['La clavicule','L’omoplate','L’humérus','Le radius'],'clavicle','La clavicule, os en forme de S, relie le sternum à l’omoplate. C’est l’un des os les plus souvent fracturés, surtout après une chute sur l’épaule.','Clavicule'],
[0,'Quel os va de l’épaule au coude ?',['L’humérus','Le radius','Le fémur','Le cubitus'],'humerus','L’humérus est l’os du haut du bras. Au coude, il s’articule avec le radius et le cubitus, les deux os de l’avant-bras.','Humérus'],
[1,'Combien d’os compte le squelette d’un adulte ?',['206','106','306','412'],'skull','À la naissance, on compte environ 270 à 300 os, qui se soudent peu à peu pour n’en former que 206 à l’âge adulte.','Squelette_humain'],
[1,'Quels sont les deux os de l’avant-bras ?',['Le radius et le cubitus','Le tibia et le péroné','L’humérus et l’omoplate','Le fémur et la rotule'],'humerus','Le radius, côté pouce, et le cubitus, côté auriculaire, forment l’avant-bras. Ils se croisent quand on tourne la paume vers le bas.','Avant-bras'],
[1,'Combien de paires de côtes possède l’être humain ?',['12','7','10','24'],'ribs','Nous avons 12 paires de côtes, soit 24 au total : 7 « vraies » reliées au sternum, 3 « fausses » reliées indirectement et 2 « flottantes » libres à l’avant.','Côte_(anatomie)'],
[2,'Quel os de la hanche résulte de la fusion de l’ilion, de l’ischion et du pubis ?',['L’os coxal','Le sacrum','Le coccyx','L’astragale'],'pelvis','L’os coxal est formé par la fusion de trois os : l’ilion, l’ischion et le pubis. Les deux os coxaux, avec le sacrum et le coccyx, forment le bassin.','Os_coxal'],

/* Classement du jour */
async function lb(){const el=$("#lb");if(!el)return;const k=today(),d=st.get("d_"+k);let R=[];
if(db)try{R=(await db.collection("scores").get()).docs.map(x=>({...x.data(),id:x.id})).filter(x=>x&&x.day==k&&x.name)}catch(e){}
R=R.filter(x=>x.id!=uid);if(d)R.push({name:ME.name,pts:d.s,me:1,total:tot()});R.sort((a,b)=>b.pts-a.pts);
const rk=R.map((x,i)=>({...x,i})),mine=rk.find(x=>x.me);
const row=x=>`<li class="${x.me?"me":""}" style="animation-delay:${x.i*70}ms"><b>${x.i+1}</b>${av(x.name)}<span>${esc(x.name)}${x.me?" (toi)":""}<small>${RK[rkOf(x.total||0)][2]} ${RK[rkOf(x.total||0)][0]}</small></span><em>${x.pts}<small> pts</small></em></li>`;
el.innerHTML=rk.slice(0,8).map(row).join("")+(mine&&mine.i>7?`<li class="gap">…</li>${row(mine)}`:"")+(d?"":`<li class="me ghost"><b>–</b>${av(ME.name)}<span>${esc(ME.name)} (toi)</span><em>à jouer</em></li>`)+(ready&&!db?`<li class="gap mut" style="font-size:13px">Classement partagé indisponible ici : seul ton score est affiché.</li>`:"")}
async function save(d){if(!db)return;try{const r=db.collection("scores").doc(uid),s=await r.get(),o=s.exists?s.data():{};await r.set({name:ME.name,day:today(),pts:d.s,total:(o.total||0)+d.s})}catch(e){}}

/* Écrans */
const cur=()=>M.mode=="d"?M.list[M.i]:M.q;
const draw=()=>{if(!M.deck.length)M.deck=shuf(Q);return M.deck.pop()};
function sk(){const s=st.get("streak");return s&&(s.last==today()||s.last==ymd(new Date(Date.now()-864e5)))?s.n:0}
function home(){clearInterval(cd);clearInterval(qt);cyc();const d=st.get("d_"+today()),n=sk();
app.innerHTML=`<button class='me' onclick='profile()'>${av(ME.name)}<div><b>${esc(ME.name)}</b><small>${RK[rkOf(tot())][2]} ${RK[rkOf(tot())][0]}</small>${rkBar(tot())}</div><span class='sk${n?'':' off'}'><i class='fl'>🔥</i>${n}</span></button>

<div class="tiles"><button class="tile hot" onclick="daily()"><i>⚡</i><b>Quiz du jour</b><span>${d?`Terminé : ${d.s} points`:"5 questions, nouvelles à minuit"}</span></button><button class="tile" onclick="free()"><i>🎲</i><b>Partie libre</b><span>5 questions aléatoires, rejouable à volonté</span></button></div>

function daily(){const k=today(),d=st.get("d_"+k);if(d)return result(d);const r=rng(hash(k)),p=[0,1,2].map(l=>shuf(Q.filter(q=>q[0]==l),r));
M={mode:"d",list:Array.from({length:5},()=>p[Math.floor(r()*3)].pop()),i:0,s:0};show()}
function free(){M={mode:"f",deck:[],n:0,s:0};M.q=draw();show()}
function show(){clearInterval(tm);clearInterval(cd);clearInterval(qt);const q=cur();setStage(M.mode=="d"?Math.min(3,M.i):M.n%4);
M.a=shuf(q[2].map((t,j)=>[t,j==0]));
app.innerHTML=`<div class="bar"><button class="lnk" onclick="home()">← Accueil</button><span class="tag" style="margin:0">${M.mode=="d"?`Question ${M.i+1} sur 5`:`Partie libre, question ${M.n+1} sur 5`} | Score : ${M.s}</span></div>
<span class="lv l${q[0]}">${LV[q[0]]} (jusqu’à ${MAX[q[0]]} pts)</span><div class="tm" id="tm"><div class="tb" id="tb"></div><div class="pt"><b id="pt">${MAX[q[0]]}</b> pts</div></div><h2>${q[1]}</h2>
<div class="col" id="ans">${M.a.map((x,j)=>`<button class="ans" onclick="pick(${j})"><i>${"ABCD"[j]}</i>${x[0]}</button>`).join("")}</div><div id="ex"></div>`;scrollTo(0,0);
M.t0=performance.now();qt=setInterval(()=>{const l=q[0],p=pts(l,(performance.now()-M.t0)/1e3),r=p/MAX[l];$("#pt").textContent=p;$("#tb").style.transform=`scaleX(${r})`;$("#tb").style.setProperty("--tc",`hsl(${r*120} 70% 45%)`)},100)}
function cnt(el,to){const t0=performance.now(),f=n=>{const k=Math.min(1,(n-t0)/900);el.textContent="+"+Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
function pick(j){clearInterval(qt);const q=cur(),ok=M.a[j][1],p=pts(q[0],(performance.now()-M.t0)/1e3),c=M.a.findIndex(x=>x[1]),A=[...document.querySelectorAll(".ans")],last=(M.mode=="d"&&M.i==4)||(M.mode=="f"&&M.n==4);
A.forEach(b=>b.disabled=true);if(ok)M.s+=p;hs({m:M.mode,q:Q.indexOf(q),a:M.a[j][0],ok:!!ok,p:ok?p:0});
const fin=()=>{A.forEach((b,i)=>{b.classList.remove("bad");b.classList.add(i==c?"good":"out")});$("#tm").classList.add("off");
setTimeout(()=>{$("#ex").innerHTML=`<div class="rv"><div class="gain${ok?"":" zero"}"><span id="gn">+0</span><b>${ok?"points, bien joué !":"point : la bonne réponse est ci-dessus"}</b></div>

<button class="big" onclick="nxt()"><b>${last?"Voir mon résultat":"Question suivante"}</b></button></div>`;cnt($("#gn"),ok?p:0);$("#ex").scrollIntoView({behavior:"smooth",block:"nearest"})},450)};
if(ok)fin();else{A[j].classList.add("bad");setTimeout(fin,650)}}
function nxt(){if(M.mode=="f"){if(M.n>=4)return freeEnd();M.n++;M.q=draw();return show()}if(M.i<4){M.i++;return show()}
const k=today(),d={s:M.s},s=st.get("streak")||{n:0,last:""};

function tick(){const n=new Date(),s=Math.floor((new Date(n.getFullYear(),n.getMonth(),n.getDate()+1)-n)/1e3),p=x=>String(x).padStart(2,"0"),e=$("#cd");if(e)e.textContent=`${p(s/3600|0)}:${p(s/60%60|0)}:${p(s%60)}`}
